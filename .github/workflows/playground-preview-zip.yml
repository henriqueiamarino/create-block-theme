name: Build Playground preview zip

on:
    push:
        branches:
            - edit-theme-settings
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build plugin
              run: npm run build

            - name: Package plugin zip
              run: npx wp-scripts plugin-zip

            - name: Upload zip to preview-1 release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload preview-1 create-block-theme.zip --clobber
